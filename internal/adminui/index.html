<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14221f">
<meta name="description" content="温知学习内容管理平台 · 资料入库、审核、来源管理与客户端查询接口工作台">
<title>首页 · 温知</title>
<link rel="stylesheet" href="/workspace/app.css">
<link rel="stylesheet" href="/workspace/roadmaps.css">
<link rel="stylesheet" href="/workspace/user-management.css">
<link rel="stylesheet" href="/workspace/home.css">
<link rel="stylesheet" href="/workspace/tasks.css">
</head>
<body class="unauthenticated">
<div class="mobile-shade" data-action="close-nav"></div>
<aside class="sidebar" aria-label="主导航">
  <a class="brand" href="#home" aria-label="温知数据服务首页">
    <span class="brand-logo"><svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M6 7h9v17H6z" fill="#253c2c"/><path d="m19 6 8 3-6 17-8-3z" fill="#253c2c"/><path d="M9 11h3m-3 3h3" stroke="#d4eea0" stroke-width="1.5"/></svg></span>
    <span class="brand-name">温知<small>DATA SERVICE</small></span>
  </a>
  <button class="workspace user-only" data-action="workspace"><span class="workspace-avatar"><span class="icon" data-icon="layers"></span></span><span><strong>温知数据服务</strong><small>资料录入与查询</small></span><span class="icon" data-icon="chevrons"></span></button>
  <nav class="nav-list home-nav" aria-label="工作台导航">
    <button class="nav-item active" data-route="home" title="首页"><span class="icon" data-icon="home"></span><span class="nav-label">首页</span></button>
  </nav>
  <div class="nav-group-title user-only">资料数据服务</div>
  <nav class="nav-list user-only" aria-label="资料服务导航">
    <button class="nav-item" data-route="library" title="数据录入"><span class="icon" data-icon="upload"></span><span class="nav-label">数据录入</span><span class="nav-count" id="nav-count">0</span></button>
    <button class="nav-item" data-route="query" title="数据管理"><span class="icon" data-icon="search"></span><span class="nav-label">数据管理</span></button>
    <button class="nav-item" data-route="rss" title="RSS 订阅"><span class="icon" data-icon="rss"></span><span class="nav-label">RSS 订阅</span></button>
    <button class="nav-item" data-route="roadmaps" title="学习路线图"><span class="icon" data-icon="roadmap"></span><span class="nav-label">学习路线图</span></button>
    <button class="nav-item" data-route="clients" title="客户端管理"><span class="icon" data-icon="monitor"></span><span class="nav-label">客户端管理</span></button>
  </nav>
  <div class="nav-group-title">Agent 服务</div>
  <nav class="nav-list" aria-label="Agent 服务导航">
    <button class="nav-item" data-route="agent-access" title="Agent 接入"><span class="icon" data-icon="code"></span><span class="nav-label">Agent 接入</span></button>
    <button class="nav-item" data-route="tasks" title="收集任务"><span class="icon" data-icon="upload"></span><span class="nav-label">收集任务</span></button>
  </nav>
  <div class="nav-group-title admin-only">系统管理</div>
  <nav class="nav-list admin-only" aria-label="管理员导航">
    <button class="nav-item" data-route="users" title="用户管理"><span class="icon" data-icon="shield"></span><span class="nav-label">用户管理</span></button>
  </nav>
  <div class="sidebar-bottom">
    <div class="storage user-only"><div class="storage-title"><span class="icon" data-icon="cloud"></span>附件存储</div><div class="storage-info" id="storage-info">正在连接服务…</div></div>
    <button class="nav-item user-only" data-action="settings" title="系统设置"><span class="icon" data-icon="settings"></span><span class="nav-label">系统设置</span></button>
    <button class="nav-item" data-action="logout" title="退出登录"><span class="icon" data-icon="close"></span><span class="nav-label">退出登录</span></button>
    <div class="sidebar-foot"><span class="dot"></span>服务端工作区 <span style="margin-left:auto">v0.3.0</span></div>
  </div>
</aside>
<div class="shell">
  <header class="topbar">
    <div class="breadcrumbs"><button class="icon-btn mobile-menu" data-action="open-nav" aria-label="打开导航"><span class="icon" data-icon="menu"></span></button><span class="icon" data-icon="home"></span><span class="parent">工作空间</span><span class="slash">/</span><span id="breadcrumb-current">首页</span></div>
    <div class="topbar-right">
      <label class="global-search user-only"><span class="icon" data-icon="search"></span><input id="global-search" aria-label="全局搜索资料" placeholder="搜索你的知识资料…" autocomplete="off"><span class="kbd">/</span></label>
      <div class="top-tools user-only"><button class="icon-btn" data-action="help" aria-label="使用帮助" title="使用帮助"><span class="icon" data-icon="help"></span></button><button class="icon-btn notification" id="notification-button" data-action="notifications" aria-label="通知，有未读消息" title="通知"><span class="icon" data-icon="bell"></span></button></div>
      <button class="user-button user-only" data-action="settings" aria-label="用户与系统设置"><span class="avatar" id="profile-avatar">管</span><span><strong id="profile-name">当前用户</strong><small>个人资料工作区</small></span><span class="icon" data-icon="chevronDown"></span></button>
    </div>
  </header>
  <main class="main" id="main-content"></main>
</div>
<section id="login-root"></section><div id="drawer-root"></div><div id="modal-root"></div><div id="context-root"></div><div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
<noscript><div style="position:fixed;inset:0;z-index:999;background:#f6f8ef;display:grid;place-items:center;padding:30px">请启用 JavaScript 以使用管理工作台。</div></noscript>
<script src="/workspace/auth-sync.js" defer></script>
<script src="/workspace/qrcodegen.js" defer></script>
<script src="/workspace/roadmaps.js" defer></script>
<script src="/workspace/user-management.js" defer></script>
<script src="/workspace/home.js" defer></script>
<script src="/workspace/tasks.js" defer></script>
<script src="/workspace/agent-access.js" defer></script>
<script src="/workspace/app.js" defer></script>
</body>
</html>
