<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14221f">
<meta name="description" content="知序学习内容管理平台 · 资料入库、审核、来源管理与内容推送管理工作台">
<title>学习资料库 · 知序</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body class="unauthenticated">
<div class="mobile-shade" data-action="close-nav"></div>
<aside class="sidebar" aria-label="主导航">
  <a class="brand" href="#library" aria-label="知序学习内容平台首页">
    <span class="brand-logo"><svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M6 7h9v17H6z" fill="#253c2c"/><path d="m19 6 8 3-6 17-8-3z" fill="#253c2c"/><path d="M9 11h3m-3 3h3" stroke="#d4eea0" stroke-width="1.5"/></svg></span>
    <span class="brand-name">知序<small>KNOWLEDGE STUDIO</small></span>
  </a>
  <button class="workspace" data-action="workspace"><span class="workspace-avatar"><span class="icon" data-icon="layers"></span></span><span><strong>知序学习空间</strong><small>内容管理工作台</small></span><span class="icon" data-icon="chevrons"></span></button>
  <div class="nav-group-title">工作空间</div>
  <nav class="nav-list" aria-label="内容管理">
    <button class="nav-item" data-route="overview" title="内容总览"><span class="icon" data-icon="dashboard"></span><span class="nav-label">内容总览</span></button>
    <button class="nav-item active" data-route="library" title="学习资料库"><span class="icon" data-icon="library"></span><span class="nav-label">学习资料库</span><span class="nav-count" id="nav-count">0</span></button>
    <button class="nav-item" data-route="collections" title="专题合集"><span class="icon" data-icon="layers"></span><span class="nav-label">专题合集</span></button>
    <button class="nav-item" data-route="push" title="推送管理"><span class="icon" data-icon="send"></span><span class="nav-label">推送管理</span><span class="nav-indicator"></span></button>
  </nav>
  <div class="nav-section-gap"></div><div class="nav-group-title">连接与洞察</div>
  <nav class="nav-list" aria-label="连接管理">
    <button class="nav-item" data-route="sources" title="内容来源"><span class="icon" data-icon="globe"></span><span class="nav-label">内容来源</span></button>
    <button class="nav-item" data-route="clients" title="客户端管理"><span class="icon" data-icon="monitor"></span><span class="nav-label">客户端管理</span></button>
    <button class="nav-item" data-route="analytics" title="数据洞察"><span class="icon" data-icon="chart"></span><span class="nav-label">数据洞察</span></button>
  </nav>
  <div class="sidebar-bottom">
    <div class="storage"><div class="storage-title"><span class="icon" data-icon="cloud"></span>附件存储</div><div class="storage-info" id="storage-info">正在连接服务…</div></div>
    <button class="nav-item" data-action="settings" title="工作空间设置"><span class="icon" data-icon="settings"></span><span class="nav-label">工作空间设置</span></button>
    <div class="sidebar-foot"><span class="dot"></span>服务端工作区 <span style="margin-left:auto">v0.3.0</span></div>
  </div>
</aside>
<div class="shell">
  <header class="topbar">
    <div class="breadcrumbs"><button class="icon-btn mobile-menu" data-action="open-nav" aria-label="打开导航"><span class="icon" data-icon="menu"></span></button><span class="icon" data-icon="home"></span><span class="parent">工作空间</span><span class="slash">/</span><span id="breadcrumb-current">学习资料库</span></div>
    <div class="topbar-right">
      <label class="global-search"><span class="icon" data-icon="search"></span><input id="global-search" aria-label="全局搜索资料" placeholder="搜索你的知识资料…" autocomplete="off"><span class="kbd">/</span></label>
      <div class="top-tools"><button class="icon-btn" data-action="help" aria-label="使用帮助" title="使用帮助"><span class="icon" data-icon="help"></span></button><button class="icon-btn notification" id="notification-button" data-action="notifications" aria-label="通知，有未读消息" title="通知"><span class="icon" data-icon="bell"></span></button></div>
      <button class="user-button" data-action="settings" aria-label="用户与工作空间设置"><span class="avatar" id="profile-avatar">管</span><span><strong id="profile-name">管理员</strong><small>工作空间管理员</small></span><span class="icon" data-icon="chevronDown"></span></button>
    </div>
  </header>
  <main class="main" id="main-content"></main>
</div>
<section id="login-root"></section><div id="drawer-root"></div><div id="modal-root"></div><div id="context-root"></div><div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
<noscript><div style="position:fixed;inset:0;z-index:999;background:#f6f8ef;display:grid;place-items:center;padding:30px">请启用 JavaScript 以使用管理工作台。</div></noscript>
<script src="/admin/app.js" defer></script>
</body>
</html>
