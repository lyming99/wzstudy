name: wzstudy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wzstudy
      POSTGRES_USER: wzstudy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wzstudy -d wzstudy"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No database port is exposed to the host. Use a separate dev override if needed.
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      STORE: postgres
      DATA_DIR: /var/lib/wzstudy
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wzstudy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/wzstudy?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      READ_API_KEY: ${READ_API_KEY:?Set READ_API_KEY}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
      SYSTEM_ADMIN_DISPLAY_NAME: ${SYSTEM_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      POLL_ENABLED: ${POLL_ENABLED:-true}
    command: ["/bin/sh", "-c", "/app/migrate && exec /app/api"]
    volumes:
      - api_data:/var/lib/wzstudy
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s
volumes:
  postgres_data:
  api_data:
