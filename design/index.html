function handleFiles(files){uploadFiles=Array.from(files);$('#file-preview').textContent=uploadFiles.map(f=>f.name+' · '+formatBytes(f.size)).join(' / ');const first=uploadFiles[0];if(!first)return;const title=$('#material-title');if(!title.value)title.value=first.name.replace(/\.[^.]+$/,'');const select=$('#material-type');select.value=first.type.startsWith('audio/')?'audio':first.type.startsWith('video/')?'video':first.type.startsWith('image/')?'carousel':'article';$('#article-field').classList.toggle('hide',select.value!=='article')}

function saveSource(form){const fd=new FormData(form),kind=String(fd.get('kind')),name=String(fd.get('name')).trim();if(!name)return formError('请填写来源名称。');if(kind==='rss'){try{const u=new URL(String(fd.get('url')));if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error()}catch(e){return formError('请输入有效的 HTTP 或 HTTPS 订阅地址。')}}state.sources.push({id:uid('s'),name,kind,device:kind==='rss'?'rss':'monitor',desc:String(fd.get('desc')).trim()||'等待新的学习内容接入',enabled:true,last:'尚未同步',volume:'0',category:String(fd.get('category')),url:kind==='rss'?String(fd.get('url')):''});persist();closeModal();renderPage();toast('来源已登记；正式接入需连接后端服务')}
function newCollectionModal(){openModal('创建专题合集','围绕一个主题，让知识产生新的连接。',`<form id="collection-form"><div class="field"><label for="collection-name">合集名称 <span class="required">*</span></label><input id="collection-name" name="name" required maxlength="60" placeholder="给这段学习旅程起个名字"></div><div class="field"><label for="collection-category">自动归集分类</label><select id="collection-category" name="category">${categoriesOptions()}</select><p class="field-note">同分类的资料将自动展示在此合集，包含草稿与待审核资料。</p></div><div class="field"><label for="collection-desc">一句话介绍</label><input id="collection-desc" name="desc" maxlength="100" placeholder="这段旅程，将带来什么？"></div><div class="field"><label for="collection-color">封面色系</label><select id="collection-color" name="art"><option value="green">草木绿</option><option value="purple">雾紫色</option><option value="blue">湖水蓝</option></select></div><div id="form-error"></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit" form="collection-form">创建合集</button>`,{icon:'layers'})}
function settingsModal(){openModal('工作空间设置','让这个空间，更适合你的学习节奏。',`<form id="settings-form"><div class="field"><label for="settings-name">管理员显示名称</label><input id="settings-name" name="name" maxlength="20" required value="${esc(state.settings.name)}"></div><div class="setting-row"><div><h3>紧凑列表</h3><p>缩小行高，在一屏中查看更多资料</p></div><button type="button" class="switch ${state.settings.compact?'on':''}" id="setting-compact" role="switch" aria-label="紧凑列表" aria-checked="${state.settings.compact}" data-action="setting-toggle"></button></div><div class="setting-row"><div><h3>新内容人工审核</h3><p>本原型固定启用，资料审核后才能推送</p></div><span class="badge published">始终开启</span></div><div class="setting-row" style="border-bottom:0"><div><h3>重置演示数据</h3><p>清除本地修改，恢复初始资料与计划</p></div><button type="button" class="btn small-btn danger" data-action="reset-demo">重置</button></div><div class="info-box" style="margin-top:10px">${icon('info')}<span>设置只保存在此浏览器，不修改服务端配置。清理浏览器数据后将恢复默认状态。</span></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" form="settings-form" type="submit">保存设置</button>`,{icon:'settings'})}
function helpModal(){openModal('让知识有序流动','欢迎来到温知 · 学习内容管理工作台',`<div class="guide-grid">${[['upload','01 / 连接与入库','上传本地文件，或登记互联网链接。'],['checkCircle','02 / 审核与发布','在待审核列表检查资料，再进行发布。'],['layers','03 / 整理与连接','用分类、标签和专题串联不同的知识。'],['send','04 / 计划与推送','选择已发布资料，创建定时推送计划。']].map(([i,t,d])=>`<div class="guide-item">${icon(i)}<h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="info-box">${icon('info')}<span>这是独立 HTML 交互原型，不连接现有 Go API。所有示例数据与修改均存于浏览器；按 <b>/</b> 聚焦搜索，按 <b>Esc</b> 关闭弹窗或详情。</span></div>`,null,{icon:'help',className:'wide'})}
function notificationsModal(){openModal('工作空间通知','今天，也有新的知识正在抵达。',`<div class="notification-item"><span class="source-large-icon">${icon('clock')}</span><div><strong>${countStatus('pending')} 份资料等待审核</strong><p style="margin-top:3px">检查新入库的内容，让好资料与更多人相遇。</p><time>资料库实时汇总 · 本地演示</time></div></div><div class="notification-item"><span class="source-large-icon">${icon('send')}</span><div><strong>${state.plans.filter(p=>p.status==='scheduled').length} 个推送计划待执行</strong><p style="margin-top:3px">你可以在推送管理里检查内容与接收范围。</p><time>推送计划汇总 · 本地演示</time></div></div><div class="notification-item" style="border:0"><span class="source-large-icon">${icon('shield')}</span><div><strong>你的工作空间已准备就绪</strong><p style="margin-top:3px">所有操作仅发生在本地，不影响线上资料。</p><time>系统提示</time></div></div>`,`<button class="btn" data-action="mark-read">全部标记已读</button><button class="btn primary" data-action="review-list">去审核资料</button>`,{icon:'bell'})}
function openMenu(id,button){const i=itemById(id);if(!i)return;const r=button.getBoundingClientRect();$('#context-root').innerHTML=`<div class="context-menu" role="menu" aria-label="资料操作" style="top:${Math.max(8,Math.min(r.bottom+5,innerHeight-205))}px;left:${Math.max(8,Math.min(r.right-162,innerWidth-170))}px"><button role="menuitem" data-action="detail" data-id="${id}">${icon('eye')}查看资料</button><button role="menuitem" data-action="edit" data-id="${id}">${icon('edit')}编辑资料</button>${i.status==='published'?`<button role="menuitem" data-action="push-item" data-id="${id}">${icon('send')}加入推送计划</button>`:`<button role="menuitem" data-action="publish" data-id="${id}">${icon('checkCircle')}${i.status==='draft'?'提交审核':'审核并发布'}</button>`}<button class="danger" role="menuitem" data-action="delete" data-id="${id}">${icon('trash')}删除资料</button></div>`;$('.context-menu button')?.focus()}
function closeMenu(){$('#context-root').innerHTML=''}
function exportCSV(){const rows=[['标题','类型','分类','来源','状态','作者'],...state.items.map(i=>[i.title,TYPES[i.type],i.category,sourceById(i.source)?.name||'互联网采集',({pending:'待审核',published:'已发布',draft:'草稿'})[i.status],i.author])];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='温知-学习资料清单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('资料清单已导出为 CSV 文件')}
// Event delegation keeps all views usable without any build step or network dependency.
document.addEventListener('click',event=>{
 const e=event.target;if(!(e instanceof Element))return;const routeButton=e.closest('[data-route]');if(routeButton){navigate(routeButton.dataset.route);return}
 if(e.matches('[data-overlay="modal"]')){closeModal();return}if(e.matches('[data-overlay="drawer"]')){closeDrawer();return}
 const b=e.closest('[data-action]');if(!b){if(!e.closest('.context-menu'))closeMenu();const row=e.closest('[data-item]');if(row&&!e.closest('input,label,button,a'))openDrawer(row.dataset.item);return}const {action,id,value}=b.dataset;
 if(action!=='more')closeMenu();
 switch(action){
 case 'upload':uploadModal();break;case 'collect':collectModal();break;case 'close-modal':closeModal();break;case 'close-drawer':closeDrawer();break;case 'detail':openDrawer(id);break;case 'edit':uploadModal(itemById(id));break;
 case 'status':filters.status=value;page=1;selected.clear();renderPage();break;case 'view':view=value;renderPage();break;case 'sort':filters.sort=filters.sort==='desc'?'asc':'desc';page=1;renderPage();break;
 case 'reset-filters':filters={status:'all',type:'all',category:'all',query:'',sort:'desc'};page=1;selected.clear();renderPage();break;case 'page':page=Number(value);updateResults();break;
 case 'clear-selection':selected.clear();updateResults();break;case 'more':openMenu(id,b);break;case 'publish':publishItems([id]);break;case 'bulk-publish':publishItems([...selected]);selected.clear();updateResults();break;
 case 'delete':deleteMaterials([id]);break;case 'bulk-delete':deleteMaterials([...selected]);break;case 'push-item':planModal([id]);break;case 'bulk-push':planModal([...selected]);break;case 'new-plan':planModal();break;
 case 'detail-tab':detailTab=value;document.querySelectorAll('.detail-tabs button').forEach(x=>{x.classList.toggle('active',x.dataset.value===value);x.setAttribute('aria-selected',String(x.dataset.value===value))});updateDetail();break;
 case 'slide':slide+=Number(value);updateDetail();break;case 'demo-player':toast('此资料未附真实媒体，可上传本地文件体验播放器');break;
 case 'push-filter':pushFilter=value;renderPage();break;case 'toggle-plan':{const p=state.plans.find(p=>p.id===id);p.status=p.status==='paused'?'scheduled':'paused';persist();renderPage();toast(p.status==='paused'?'推送计划已暂停':'推送计划已恢复');break}
 case 'run-plan':{const p=state.plans.find(p=>p.id===id);const eligible=p.items.map(itemById).filter(i=>i?.status==='published');if(!eligible.length){toast('此计划没有可推送的已发布资料，请重新创建计划');break}openModal('模拟执行推送','仅演示状态流转，不发送真实通知。',`<p style="font-size:12px;color:#8b9f76;line-height:2">将把「${esc(p.title)}」中的 ${eligible.length} 份已发布资料标记为已推送，接收范围为${esc(p.channel)}。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" id="confirm-run">${icon('send')}确认模拟推送</button>`,{icon:'send',className:'compact'});$('#confirm-run').onclick=()=>{p.status='done';p.completedAt=new Date().toLocaleString('zh-CN');persist();closeModal();renderPage();toast('已模拟完成推送，未发送真实通知')};break}
 case 'delete-plan':{const p=state.plans.find(p=>p.id===id);openModal('删除推送计划？','此操作不会删除计划中的学习资料。',`<p style="color:#8c9f79;font-size:12px">即将删除「${esc(p.title)}」。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" id="confirm-plan-delete">确认删除</button>`,{icon:'trash',className:'compact'});$('#confirm-plan-delete').onclick=()=>{state.plans=state.plans.filter(p=>p.id!==id);persist();closeModal();renderPage();toast('推送计划已删除')};break}
 case 'plan-report':{const p=state.plans.find(p=>p.id===id);openModal('推送记录',esc(p.title),`<div class="info-box">${icon('checkCircle')}<span>状态：已模拟完成<br>内容：${p.items.length} 份资料<br>接收范围：${esc(p.channel)}<br>记录时间：${esc(p.completedAt||p.date.replace('T',' '))}<br>此记录为本地演示，没有产生真实网络请求或通知。</span></div>`,null,{icon:'send'});break}
 case 'new-source':sourceModal();break;case 'toggle-source':{const s=sourceById(id);s.enabled=!s.enabled;persist();renderPage();toast(s.name+(s.enabled?'已启用':'已暂停'));break}case 'sync-source':{const s=sourceById(id);if(!s.enabled)break;s.last='刚刚（模拟）';persist();renderPage();toast('来源同步状态已模拟更新，未请求网络');break}
 case 'new-collection':newCollectionModal();break;case 'open-collection':{const c=state.collections.find(c=>c.id===id);filters={status:'all',type:'all',category:c.category,query:'',sort:'desc'};page=1;navigate('library');toast('正在查看「'+c.name+'」分类中的资料');break}
 case 'settings':settingsModal();break;case 'setting-toggle':b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'));break;case 'reset-demo':{openModal('重置演示工作区？','此操作将清除你在本原型中的所有本地修改。',`<p style="font-size:12px;color:#91a27b;line-height:2">上传的资料信息、来源、合集与计划将恢复为初始演示数据。不会影响项目文件或任何线上内容。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" id="confirm-reset">确认重置</button>`,{icon:'refresh',className:'compact'});$('#confirm-reset').onclick=()=>{try{localStorage.removeItem(STORAGE_KEY)}catch(e){}location.reload()};break}
 case 'help':helpModal();break;case 'notifications':notificationsModal();break;case 'mark-read':state.notificationsRead=true;persist();closeModal();renderPage();toast('所有通知已标记为已读');break;case 'review-list':filters={status:'pending',type:'all',category:'all',query:'',sort:'desc'};page=1;navigate('library');break;
 case 'workspace':openModal('温知学习空间','一个让好内容有序流动的地方。',`<div class="info-box">${icon('layers')}<span>当前空间：温知学习空间<br>空间类型：本地原型演示<br>你的角色：工作空间管理员<br>资料信息与设置仅保存在当前浏览器。</span></div>`,null,{icon:'layers',className:'compact'});break;
 case 'export':exportCSV();break;case 'open-nav':document.body.classList.add('mobile-open');break;case 'close-nav':document.body.classList.remove('mobile-open');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){filters.query=e.target.value;page=1;selected.clear();updateResults()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-select]')){t.checked?selected.add(t.dataset.select):selected.delete(t.dataset.select);updateResults()}if(t.id==='select-all'){currentItems().forEach(i=>t.checked?selected.add(i.id):selected.delete(i.id));updateResults()}if(t.id==='type-filter'||t.id==='category-filter'){filters[t.id==='type-filter'?'type':'category']=t.value;page=1;selected.clear();updateResults()}if(t.id==='file-input')handleFiles(t.files);if(t.id==='material-type')$('#article-field').classList.toggle('hide',t.value!=='article');if(t.id==='source-kind'){$('#source-url-field').classList.toggle('hide',t.value!=='rss');$('#source-url').required=t.value==='rss'}});
document.addEventListener('submit',e=>{const form=e.target;if(!['upload-form','collect-form','plan-form','source-form','settings-form','collection-form'].includes(form.id))return;e.preventDefault();if(form.id==='upload-form'){saveUpload(form);return}if(form.id==='collect-form'){saveCollectionLink(form);return}if(form.id==='plan-form'){savePlan(form);return}if(form.id==='source-form'){saveSource(form);return}const fd=new FormData(form);if(form.id==='settings-form'){const name=String(fd.get('name')).trim();if(!name)return toast('显示名称不能为空');state.settings.name=name;state.settings.compact=$('#setting-compact').classList.contains('on');persist();closeModal();renderPage();toast('工作空间设置已保存')}if(form.id==='collection-form'){const name=String(fd.get('name')).trim();if(!name)return formError('请填写合集名称。');state.collections.push({id:uid('c'),name,category:String(fd.get('category')),subtitle:String(fd.get('desc')).trim()||'让知识产生新的连接',art:String(fd.get('art')),headline:name.length>10?name.slice(0,10)+'…':name});persist();closeModal();renderPage();toast('专题合集已创建')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal-root').children.length)closeModal();else if($('#context-root').children.length)closeMenu();else if($('#drawer-root').children.length)closeDrawer();else document.body.classList.remove('mobile-open');return}if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#modal-root').children.length&&!$('#drawer-root').children.length){e.preventDefault();if(matchMedia('(max-width:700px)').matches){navigate('library');$('#library-search')?.focus()}else $('#global-search').focus()}if(e.target.id==='global-search'&&e.key==='Enter'){e.preventDefault();filters={status:'all',type:'all',category:'all',query:e.target.value,sort:'desc'};page=1;navigate('library');$('#library-search')?.focus()}if(e.target.id==='dropzone'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#file-input').click()}if(e.key==='Tab'){const region=$('#modal-root .dialog')||$('#drawer-root .drawer');if(region){const focusable=[...region.querySelectorAll('button:not(:disabled),input:not([type=hidden]):not([type=file]),select,textarea,a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}}});
['dragenter','dragover','dragleave','drop'].forEach(name=>document.addEventListener(name,e=>{const zone=e.target instanceof Element?e.target.closest('#dropzone'):null;if(!zone)return;e.preventDefault();if(name==='dragenter'||name==='dragover')zone.classList.add('dragging');else zone.classList.remove('dragging');if(name==='drop')handleFiles(e.dataTransfer.files)}));
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(ROUTES[r])navigate(r)});
window.addEventListener('scroll',closeMenu,{passive:true});window.addEventListener('resize',closeMenu);
window.addEventListener('beforeunload',()=>objectURLs.forEach(urls=>urls.forEach(URL.revokeObjectURL)));
hydrate();if(ROUTES[location.hash.slice(1)])route=location.hash.slice(1);renderPage();
</script>
